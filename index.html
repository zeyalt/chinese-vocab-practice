<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>华文生词练习 · 生词夜空</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0B1024;
    --bg-mid:#131B3A;
    --gold:#F0B429;
    --gold-soft:#F6D374;
    --correct:#3FB68B;
    --correct-dark:#1E7A57;
    --wrong:#E8604C;
    --wrong-dark:#B23F2C;
    --paper:#FBF7EC;
    --ink:#1B2340;
    --muted:#A3B0D6;
    --muted-dim:#5A6796;
    --kaiti: "LXGW WenKai TC","KaiTi","楷体","STKaiti","华文楷体","BiauKai","AR PL UKai CN","AR PL KaitiM GB",serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{font-size:16px; -webkit-text-size-adjust:100%;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100dvh;
    background:
      radial-gradient(ellipse at 20% -10%, #24316B 0%, transparent 55%),
      radial-gradient(ellipse at 90% 110%, #1A2454 0%, transparent 50%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 60%, var(--bg-deep) 100%);
    font-family: var(--kaiti);
    color: var(--muted);
    display:flex;
    justify-content:center;
    padding: 16px 12px calc(130px + env(safe-area-inset-bottom));
    position:relative;
    overflow-x:hidden;
  }
  .stars{ position:fixed; inset:0; pointer-events:none; z-index:0; }
  .stars span{
    position:absolute; width:2px; height:2px; background:#fff; border-radius:50%;
    opacity:.5; animation: twinkle 3.2s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15; transform:scale(1);}
    50%{opacity:.9; transform:scale(1.6);}
  }
  @media (prefers-reduced-motion: reduce){ .stars span{animation:none; opacity:.4;} }

  .app{ position:relative; z-index:1; width:100%; max-width:480px; }

  header{ text-align:center; margin-bottom:14px; }
  .eyebrow{
    font-size:.78rem; letter-spacing:.2em; color:var(--gold-soft);
    text-transform:uppercase; font-weight:700; margin-bottom:5px;
  }
  h1{ font-size:1.7rem; margin:0; color:#fff; font-weight:800; }
  h1 .accent{ color: var(--gold); }
  .sub{ font-size:.85rem; color:var(--muted); margin-top:5px; }

  .xp-wrap{ margin: 12px auto 14px; max-width: 360px; }
  .xp-meta{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:.82rem; color:var(--muted); margin-bottom:6px;
  }
  .xp-meta .lvl{ color:#fff; font-weight:800; }
  .xp-meta .lvl b{ color: var(--gold); font-size:1.15rem; }
  .xp-meta .pts{ color: var(--gold-soft); font-weight:800; }
  .xp-bar{
    height:10px; background:#1C2652; border-radius:999px; overflow:hidden;
    border:1px solid #2C3768;
  }
  .xp-fill{
    height:100%; width:0%; border-radius:999px;
    background: linear-gradient(90deg, #E7A018, var(--gold), #F6D374);
    transition: width .35s ease;
  }
  .xp-label{ text-align:center; font-size:.7rem; color:var(--muted-dim); margin-top:5px; }
  .xp-label b{ color: var(--gold-soft); }

  .controls-row{ display:flex; gap:8px; margin-bottom:10px; align-items:center; }
  select.lesson-select{
    flex:1; background:rgba(255,255,255,0.05); color:#fff; border:1px solid #2C3768;
    border-radius:12px; padding:11px 10px; font-size:.95rem; font-weight:600;
    font-family:inherit; -webkit-appearance:none; appearance:none;
  }
  .diff-row{ display:flex; gap:6px; margin-bottom:14px; }
  .diff-pill{
    flex:1; border:1px solid #2C3768; background:rgba(255,255,255,0.03);
    color:var(--muted); font-size:.82rem; padding:9px 6px; border-radius:999px;
    cursor:pointer; font-weight:700; text-align:center;
  }
  .diff-pill.active{ background: var(--gold); border-color:var(--gold); color:#221806; }

  .scorebar{ display:flex; justify-content:center; gap:20px; margin-bottom:14px; font-size:.82rem; color:var(--muted); }
  .scorebar .metric{ text-align:center; }
  .scorebar .num{ display:block; font-size:1.3rem; font-weight:800; color:#fff; }
  .scorebar .num.streak{ color: var(--gold); }

  .card{
    background: var(--paper); border-radius: 20px; padding: 22px 18px 20px;
    box-shadow: 0 20px 45px -12px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,0.04);
    position:relative;
  }
  .card::before{
    content:""; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    width:34px; height:14px; border-radius:14px 14px 0 0;
    background: linear-gradient(180deg,#3a4680,#28315e);
  }
  .tagrow{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; flex-wrap:wrap; }
  .lesson-chip{
    font-size:.72rem; font-weight:800; color:#fff; background:#3a4680;
    padding:4px 10px; border-radius:999px; white-space:nowrap;
  }
  .qtype{
    font-size:.72rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
    color:#B98A2E;
  }
  .sentence{
    font-size:1.62rem; line-height:1.75; color: var(--ink); font-weight:500;
    margin-bottom: 4px; word-break: break-word;
  }
  .sentence .target{ border-bottom: 3px solid var(--gold); font-weight:700; padding: 0 1px; }
  .sentence .blank{
    display:inline-block; min-width: 2.6em; border-bottom: 2.5px dashed #C9BFA0;
    text-align:center; color:#B98A2E; font-weight:800;
  }
  .sentence .pinyincue{ color:#B98A2E; font-weight:700; font-family: "Segoe UI","Helvetica Neue","Arial",sans-serif; }
  .pinyin{ font-family: "Segoe UI","Helvetica Neue","Arial",sans-serif !important; letter-spacing:.02em; }
  .instruction{ font-size:.85rem; color:#8B7F5E; margin: 8px 0 16px; }

  .options{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .options.six{ grid-template-columns: 1fr 1fr; }
  .opt{
    background:#fff; border:2.5px solid #E7DFC7; border-radius:14px;
    padding:15px 10px; font-size:1.12rem; font-weight:500; color:var(--ink);
    cursor:pointer; transition: all .12s ease; text-align:center; font-family: inherit;
    min-height:48px; touch-action:manipulation;
  }
  .opt.selected{ border-color: var(--ink); background:#F3EFE0; }
  .opt:disabled{ cursor:default; }
  .opt.correct{ background: #E6F7F0; border-color: var(--correct); color:var(--correct-dark); }
  .opt.wrong{ background: #FCEAE6; border-color: var(--wrong); color:var(--wrong-dark); }
  .opt.dim{ opacity:.4; }

  /* reorder tokens */
  .answerzone{
    min-height:56px; border:2.5px dashed #D9D0B4; border-radius:14px; padding:10px;
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; align-items:flex-start;
  }
  .bank{ display:flex; flex-wrap:wrap; gap:8px; }
  .wordbank{
    background:#FFF8E6; border:2px solid #E7DFC7; border-radius:14px;
    padding:12px 10px 10px; margin-bottom:14px;
  }
  .wordbank-label{
    font-size:.78rem; font-weight:800; color:#8B7F5E; margin-bottom:8px;
  }
  .wordbank .tok{
    background:#fff; border:2px solid #D9C98A;
  }
  .tok{
    background:#fff; border:2px solid #E7DFC7; border-radius:10px;
    padding:10px 12px; font-size:1.05rem; font-weight:500; color:var(--ink); cursor:pointer;
    min-height:44px; touch-action:manipulation; display:inline-flex; align-items:center;
  }
  .tok.placed{ background:#F3EFE0; border-color: var(--ink); }
  .tok.tokcorrect{ background:#E6F7F0; border-color:var(--correct); color:var(--correct-dark); }
  .tok.tokwrong{ background:#FCEAE6; border-color:var(--wrong); color:var(--wrong-dark); }

  .typebox{
    width:100%; font-size:1.2rem; padding:14px; border-radius:12px; border:2.5px solid #E7DFC7;
    font-family: inherit; color:var(--ink); margin-bottom:14px; font-weight:700;
    text-transform:lowercase;
  }
  .typebox:focus{ outline:none; border-color:var(--ink); }
  .typehint{ font-size:.78rem; color:#8B7F5E; margin:-8px 0 14px; }

  .correctref{
    font-size:.85rem; color:#8B7F5E; margin-top:2px;
  }

  /* bottom action bar, duolingo style */
  .bottombar{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    background: var(--paper);
    border-top:1px solid #E6DFCB;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
    box-shadow: 0 -10px 30px rgba(0,0,0,.35);
  }
  .bb-inner{ max-width:480px; margin:0 auto; }
  .feedback{
    font-size:.98rem; line-height:1.5; margin-bottom:10px; display:none; font-weight:700;
  }
  .feedback.show{ display:block; }
  .feedback.ok{ color: var(--correct-dark); }
  .feedback.no{ color: var(--wrong-dark); }
  .feedback .meaning{ display:block; font-weight:500; color:#6b6450; margin-top:3px; font-size:.85rem; }

  .bb-buttons{ display:flex; gap:10px; }
  .btn{
    flex:1; padding:15px; border-radius:14px; border:none; font-size:1.05rem;
    font-weight:800; cursor:pointer; font-family:inherit;
    min-height:52px; touch-action:manipulation;
  }
  .btn.primary{ background: var(--ink); color:#fff; }
  .btn.primary:disabled{ background:#D8D2BE; color:#a39c86; cursor:not-allowed; }
  .btn.primary.ok{ background: var(--correct-dark); }
  .btn.primary.no{ background: var(--wrong-dark); }
  .btn.skip{ background:#EFEADA; color:#8B7F5E; flex:0 0 88px; }

  .statsbar{
    text-align:center; font-size:.82rem; color:var(--muted); margin-bottom:14px;
    padding:8px 12px; background:rgba(255,255,255,0.04); border-radius:12px;
  }
  .statsbar b{ color:#fff; }

  .review-panel{
    background: var(--paper); border-radius:20px; padding:22px 18px;
    box-shadow: 0 20px 45px -12px rgba(0,0,0,.55);
  }
  .review-title{
    font-size:1.2rem; font-weight:800; color:var(--ink); margin-bottom:14px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .review-back{
    font-size:.88rem; color:#8B7F5E; cursor:pointer; font-weight:700;
    background:#EFEADA; border:none; padding:8px 14px; border-radius:10px;
    font-family:inherit;
  }
  .review-item{
    border-bottom:1px solid #E7DFC7; padding:12px 0; display:flex;
    justify-content:space-between; align-items:flex-start; gap:10px;
  }
  .review-item:last-child{ border-bottom:none; }
  .review-word{ font-size:1.2rem; font-weight:700; color:var(--ink); }
  .review-py{ font-size:.85rem; color:#8B7F5E; font-family:"Segoe UI","Helvetica Neue","Arial",sans-serif; }
  .review-meaning{ font-size:.82rem; color:#8B7F5E; }
  .review-meta{ text-align:right; white-space:nowrap; }
  .review-count{ font-size:.78rem; color:var(--wrong-dark); font-weight:700; }
  .review-lesson{ font-size:.7rem; color:#8B7F5E; }
  .review-clear{
    margin-top:14px; width:100%; padding:12px; border-radius:12px; border:none;
    font-size:.92rem; font-weight:700; cursor:pointer; font-family:inherit;
    background:#FCEAE6; color:var(--wrong-dark);
  }
  .review-empty{ text-align:center; color:#8B7F5E; padding:30px 0; font-size:.95rem; }

  footer{ text-align:center; margin-top:20px; font-size:.7rem; color:var(--muted-dim); }

  .passage-blank{
    display:inline-block; min-width:2.2em; padding:0 4px; margin:0 2px;
    border-bottom:2.5px dashed #C9BFA0; text-align:center; color:#B98A2E;
    font-weight:800; cursor:pointer; vertical-align:baseline;
  }
  .passage-blank.filled{ color:var(--ink); border-color:var(--ink); background:#F3EFE0; border-radius:6px; }
  .passage-blank.active{ box-shadow:0 0 0 2px var(--gold); border-radius:6px; }
  .passage-blank.tokcorrect{ background:#E6F7F0; border-color:var(--correct); color:var(--correct-dark); }
  .passage-blank.tokwrong{ background:#FCEAE6; border-color:var(--wrong); color:var(--wrong-dark); }

  .pts-pop{
    position:fixed; left:50%; top:38%; transform:translate(-50%,0);
    font-size:2rem; font-weight:800; color:var(--gold); pointer-events:none;
    z-index:20; opacity:0; text-shadow:0 4px 18px rgba(0,0,0,.45);
  }
  .pts-pop.show{ animation: ptsPop 0.85s ease-out forwards; }
  @keyframes ptsPop{
    0%{ opacity:0; transform:translate(-50%,12px) scale(.85); }
    18%{ opacity:1; transform:translate(-50%,0) scale(1.08); }
    100%{ opacity:0; transform:translate(-50%,-36px) scale(1); }
  }
  .combo-flash{ color: var(--gold) !important; }
  @media (max-width: 380px){
    html{ font-size:15px; }
    .sentence{ font-size:1.38rem; }
    h1{ font-size:1.45rem; }
  }
  @media (prefers-reduced-motion: reduce){
    .pts-pop.show{ animation:none; opacity:1; }
    .xp-fill{ transition:none; }
  }
</style>
</head>
<body>
<div class="stars" id="starfield"></div>

<div class="app">
  <header>
    <div class="eyebrow">华文生词练习</div>
    <h1><span class="accent">生词夜空</span></h1>
    <div class="sub">Pick an answer, tap Check. Streaks earn bonus points.</div>
  </header>

  <div class="xp-wrap">
    <div class="xp-meta">
      <span class="lvl">Lv. <b id="levelNum">1</b></span>
      <span class="pts"><b id="sessionPts">0</b> pts</span>
    </div>
    <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
    <div class="xp-label"><b id="xpNow">0</b> / 100 XP to next level</div>
  </div>

  <div class="statsbar" id="statsBar">正确率 <b>0%</b> (0/0)</div>

  <div class="scorebar">
    <div class="metric"><span class="num" id="scoreNum">0</span>correct</div>
    <div class="metric"><span class="num" id="totalNum">0</span>played</div>
    <div class="metric"><span class="num streak" id="streakNum">0</span>combo</div>
  </div>

  <div id="practiceView">
    <div class="card">
      <div class="tagrow">
        <span class="lesson-chip" id="lessonChip">练习</span>
        <span class="qtype" id="qType">拼音选择</span>
      </div>
      <div class="sentence" id="sentence"></div>
      <div class="instruction" id="instruction"></div>
      <div id="qbody"></div>
    </div>
  </div>

  <div id="reviewView" style="display:none;"></div>

  <footer>小学高华生词练习 · 个人学习用途</footer>
</div>
<div class="pts-pop" id="ptsPop"></div>

<div class="bottombar">
  <div class="bb-inner">
    <div class="feedback" id="feedback"></div>
    <div class="bb-buttons">
      <button class="btn skip" id="skipBtn">Skip</button>
      <button class="btn primary" id="actionBtn" disabled>Check</button>
    </div>
  </div>
</div>


<script src="data/vocab.js"></script>
<script src="data/zibian.js"></script>
<script src="data/dapei.js"></script>
<script src="data/extras.js"></script>
<script src="data/completions.js"></script>
<script src="data/passages.js"></script>
<script src="data/load.js"></script>
<script src="app.js?v=20260328c"></script>

</body>
</html>
