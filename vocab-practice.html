<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Zayyan 的生词夜空</title>
<style>
  :root{
    --bg-deep:#0B1024;
    --bg-mid:#131B3A;
    --gold:#F0B429;
    --gold-soft:#F6D374;
    --correct:#3FB68B;
    --correct-dark:#1E7A57;
    --wrong:#E8604C;
    --wrong-dark:#B23F2C;
    --paper:#FBF7EC;
    --ink:#1B2340;
    --muted:#A3B0D6;
    --muted-dim:#5A6796;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{font-size:17px;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% -10%, #24316B 0%, transparent 55%),
      radial-gradient(ellipse at 90% 110%, #1A2454 0%, transparent 50%),
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 60%, var(--bg-deep) 100%);
    font-family: "KaiTi","楷体","STKaiti","华文楷体","BiauKai","AR PL UKai CN","AR PL KaitiM GB","Noto Serif CJK SC","PingFang SC","Microsoft YaHei",serif;
    color: var(--muted);
    display:flex;
    justify-content:center;
    padding: 18px 12px 130px;
    position:relative;
    overflow-x:hidden;
  }
  .stars{ position:fixed; inset:0; pointer-events:none; z-index:0; }
  .stars span{
    position:absolute; width:2px; height:2px; background:#fff; border-radius:50%;
    opacity:.5; animation: twinkle 3.2s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15; transform:scale(1);}
    50%{opacity:.9; transform:scale(1.6);}
  }
  @media (prefers-reduced-motion: reduce){ .stars span{animation:none; opacity:.4;} }

  .app{ position:relative; z-index:1; width:100%; max-width:480px; }

  header{ text-align:center; margin-bottom:14px; }
  .eyebrow{
    font-size:.78rem; letter-spacing:.2em; color:var(--gold-soft);
    text-transform:uppercase; font-weight:700; margin-bottom:5px;
  }
  h1{ font-size:1.7rem; margin:0; color:#fff; font-weight:800; }
  h1 .accent{ color: var(--gold); }
  .sub{ font-size:.85rem; color:var(--muted); margin-top:5px; }

  .constellation{ margin: 14px auto 12px; max-width: 360px; }
  .constellation svg{ width:100%; height:50px; display:block; }
  .const-label{ text-align:center; font-size:.72rem; color:var(--muted-dim); letter-spacing:.05em; margin-top:2px; }
  .const-label b{ color: var(--gold-soft); font-weight:700; }

  .controls-row{ display:flex; gap:8px; margin-bottom:10px; align-items:center; }
  select.lesson-select{
    flex:1; background:rgba(255,255,255,0.05); color:#fff; border:1px solid #2C3768;
    border-radius:12px; padding:11px 10px; font-size:.95rem; font-weight:600;
    font-family:inherit; -webkit-appearance:none; appearance:none;
  }
  .diff-row{ display:flex; gap:6px; margin-bottom:14px; }
  .diff-pill{
    flex:1; border:1px solid #2C3768; background:rgba(255,255,255,0.03);
    color:var(--muted); font-size:.82rem; padding:9px 6px; border-radius:999px;
    cursor:pointer; font-weight:700; text-align:center;
  }
  .diff-pill.active{ background: var(--gold); border-color:var(--gold); color:#221806; }

  .scorebar{ display:flex; justify-content:center; gap:20px; margin-bottom:14px; font-size:.82rem; color:var(--muted); }
  .scorebar .metric{ text-align:center; }
  .scorebar .num{ display:block; font-size:1.3rem; font-weight:800; color:#fff; }
  .scorebar .num.streak{ color: var(--gold); }

  .card{
    background: var(--paper); border-radius: 20px; padding: 22px 18px 20px;
    box-shadow: 0 20px 45px -12px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,0.04);
    position:relative;
  }
  .card::before{
    content:""; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    width:34px; height:14px; border-radius:14px 14px 0 0;
    background: linear-gradient(180deg,#3a4680,#28315e);
  }
  .tagrow{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; flex-wrap:wrap; }
  .lesson-chip{
    font-size:.72rem; font-weight:800; color:#fff; background:#3a4680;
    padding:4px 10px; border-radius:999px; white-space:nowrap;
  }
  .qtype{
    font-size:.72rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
    color:#B98A2E;
  }
  .sentence{
    font-size:1.62rem; line-height:1.75; color: var(--ink); font-weight:500;
    margin-bottom: 4px; word-break: break-word;
  }
  .sentence .target{ border-bottom: 3px solid var(--gold); font-weight:700; padding: 0 1px; }
  .sentence .blank{
    display:inline-block; min-width: 2.6em; border-bottom: 2.5px dashed #C9BFA0;
    text-align:center; color:#B98A2E; font-weight:800;
  }
  .sentence .pinyincue{ color:#B98A2E; font-weight:700; font-family: "Segoe UI","Helvetica Neue","Arial",sans-serif; }
  .pinyin{ font-family: "Segoe UI","Helvetica Neue","Arial",sans-serif !important; letter-spacing:.02em; }
  .instruction{ font-size:.85rem; color:#8B7F5E; margin: 8px 0 16px; }

  .options{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .options.six{ grid-template-columns: 1fr 1fr; }
  .opt{
    background:#fff; border:2.5px solid #E7DFC7; border-radius:14px;
    padding:15px 10px; font-size:1.12rem; font-weight:500; color:var(--ink);
    cursor:pointer; transition: all .12s ease; text-align:center; font-family: inherit;
    min-height:52px;
  }
  .opt.selected{ border-color: var(--ink); background:#F3EFE0; }
  .opt:disabled{ cursor:default; }
  .opt.correct{ background: #E6F7F0; border-color: var(--correct); color:var(--correct-dark); }
  .opt.wrong{ background: #FCEAE6; border-color: var(--wrong); color:var(--wrong-dark); }
  .opt.dim{ opacity:.4; }

  /* reorder tokens */
  .answerzone{
    min-height:56px; border:2.5px dashed #D9D0B4; border-radius:14px; padding:10px;
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; align-items:flex-start;
  }
  .bank{ display:flex; flex-wrap:wrap; gap:8px; }
  .tok{
    background:#fff; border:2px solid #E7DFC7; border-radius:10px;
    padding:9px 12px; font-size:1.05rem; font-weight:500; color:var(--ink); cursor:pointer;
  }
  .tok.placed{ background:#F3EFE0; border-color: var(--ink); }
  .tok.tokcorrect{ background:#E6F7F0; border-color:var(--correct); color:var(--correct-dark); }
  .tok.tokwrong{ background:#FCEAE6; border-color:var(--wrong); color:var(--wrong-dark); }

  .typebox{
    width:100%; font-size:1.2rem; padding:14px; border-radius:12px; border:2.5px solid #E7DFC7;
    font-family: inherit; color:var(--ink); margin-bottom:14px; font-weight:700;
    text-transform:lowercase;
  }
  .typebox:focus{ outline:none; border-color:var(--ink); }
  .typehint{ font-size:.78rem; color:#8B7F5E; margin:-8px 0 14px; }

  .correctref{
    font-size:.85rem; color:#8B7F5E; margin-top:2px;
  }

  /* bottom action bar, duolingo style */
  .bottombar{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    background: var(--paper);
    border-top:1px solid #E6DFCB;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
    box-shadow: 0 -10px 30px rgba(0,0,0,.35);
  }
  .bb-inner{ max-width:480px; margin:0 auto; }
  .feedback{
    font-size:.98rem; line-height:1.5; margin-bottom:10px; display:none; font-weight:700;
  }
  .feedback.show{ display:block; }
  .feedback.ok{ color: var(--correct-dark); }
  .feedback.no{ color: var(--wrong-dark); }
  .feedback .meaning{ display:block; font-weight:500; color:#6b6450; margin-top:3px; font-size:.85rem; }

  .bb-buttons{ display:flex; gap:10px; }
  .btn{
    flex:1; padding:15px; border-radius:14px; border:none; font-size:1.05rem;
    font-weight:800; cursor:pointer; font-family:inherit;
  }
  .btn.primary{ background: var(--ink); color:#fff; }
  .btn.primary:disabled{ background:#D8D2BE; color:#a39c86; cursor:not-allowed; }
  .btn.primary.ok{ background: var(--correct-dark); }
  .btn.primary.no{ background: var(--wrong-dark); }
  .btn.skip{ background:#EFEADA; color:#8B7F5E; flex:0 0 92px; }

  .statsbar{
    text-align:center; font-size:.82rem; color:var(--muted); margin-bottom:14px;
    padding:8px 12px; background:rgba(255,255,255,0.04); border-radius:12px;
  }
  .statsbar b{ color:#fff; }

  .review-panel{
    background: var(--paper); border-radius:20px; padding:22px 18px;
    box-shadow: 0 20px 45px -12px rgba(0,0,0,.55);
  }
  .review-title{
    font-size:1.2rem; font-weight:800; color:var(--ink); margin-bottom:14px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .review-back{
    font-size:.88rem; color:#8B7F5E; cursor:pointer; font-weight:700;
    background:#EFEADA; border:none; padding:8px 14px; border-radius:10px;
    font-family:inherit;
  }
  .review-item{
    border-bottom:1px solid #E7DFC7; padding:12px 0; display:flex;
    justify-content:space-between; align-items:flex-start; gap:10px;
  }
  .review-item:last-child{ border-bottom:none; }
  .review-word{ font-size:1.2rem; font-weight:700; color:var(--ink); }
  .review-py{ font-size:.85rem; color:#8B7F5E; font-family:"Segoe UI","Helvetica Neue","Arial",sans-serif; }
  .review-meaning{ font-size:.82rem; color:#8B7F5E; }
  .review-meta{ text-align:right; white-space:nowrap; }
  .review-count{ font-size:.78rem; color:var(--wrong-dark); font-weight:700; }
  .review-lesson{ font-size:.7rem; color:#8B7F5E; }
  .review-clear{
    margin-top:14px; width:100%; padding:12px; border-radius:12px; border:none;
    font-size:.92rem; font-weight:700; cursor:pointer; font-family:inherit;
    background:#FCEAE6; color:var(--wrong-dark);
  }
  .review-empty{ text-align:center; color:#8B7F5E; padding:30px 0; font-size:.95rem; }

  footer{ text-align:center; margin-top:20px; font-size:.7rem; color:var(--muted-dim); }
</style>
</head>
<body>
<div class="stars" id="starfield"></div>

<div class="app">
  <header>
    <div class="eyebrow">华文生词练习</div>
    <h1>Zayyan 的<span class="accent">生词夜空</span></h1>
    <div class="sub">选好答案后按「检查」，答对就点亮一颗星星 ✨</div>
  </header>

  <div class="constellation">
    <svg id="constSvg" viewBox="0 0 360 50"></svg>
    <div class="const-label">本轮已点亮 <b id="constCount">0</b> / 8 颗星</div>
  </div>

  <div class="controls-row">
    <select class="lesson-select" id="lessonSelect"></select>
  </div>
  <div class="diff-row" id="diffRow"></div>

  <div class="statsbar" id="statsBar">正确率 <b>0%</b> (0/0)</div>

  <div class="scorebar">
    <div class="metric"><span class="num" id="scoreNum">0</span>答对</div>
    <div class="metric"><span class="num" id="totalNum">0</span>已作答</div>
    <div class="metric"><span class="num streak" id="streakNum">0</span>连续答对</div>
  </div>

  <div id="practiceView">
    <div class="card">
      <div class="tagrow">
        <span class="lesson-chip" id="lessonChip">第1课</span>
        <span class="qtype" id="qType">拼音选择</span>
      </div>
      <div class="sentence" id="sentence"></div>
      <div class="instruction" id="instruction"></div>
      <div id="qbody"></div>
    </div>
  </div>

  <div id="reviewView" style="display:none;"></div>

  <footer>词语取自华文课本第 1–25 课 · 加油，Zayyan！</footer>
</div>

<div class="bottombar">
  <div class="bb-inner">
    <div class="feedback" id="feedback"></div>
    <div class="bb-buttons">
      <button class="btn skip" id="skipBtn">跳过</button>
      <button class="btn primary" id="actionBtn" disabled>检查</button>
    </div>
  </div>
</div>

let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, startTime, duration, ctx, gainPeak){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(gainPeak, startTime + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.02);
}
function playCorrectSound(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const now = ctx.currentTime;
  // bright ascending two-note chime, duolingo-ish
  tone(784, now, 0.14, ctx, 0.18);        // G5
  tone(1046.5, now + 0.09, 0.22, ctx, 0.18); // C6
}
function playWrongSound(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const now = ctx.currentTime;
  tone(196, now, 0.22, ctx, 0.14); // low soft buzz
}

/* ============================================================
   Helpers
   ============================================================ */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function levenshtein(a,b){
  const m=a.length, n=b.length;
  const dp = Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}
function stripTones(s){
  const map = {'ā':'a','á':'a','ǎ':'a','à':'a','ō':'o','ó':'o','ǒ':'o','ò':'o','ē':'e','é':'e','ě':'e','è':'e',
    'ī':'i','í':'i','ǐ':'i','ì':'i','ū':'u','ú':'u','ǔ':'u','ù':'u','ü':'v','ǖ':'v','ǘ':'v','ǚ':'v','ǜ':'v'};
  return s.split('').map(c=>map[c]||c).join('');
}
function normPy(s){
  return stripTones(s).toLowerCase().replace(/[^a-z]/g,'');
}

function poolFor(needsPy, allowReorderOnly){
  return ALL.filter(e=>{
    if(!allowReorderOnly && e.reorderOnly) return false;
    if(needsPy && !e.py) return false;
    if(filterLesson!=='all' && e.l!==filterLesson) return false;
    if(difficulty!=='all' && e.diff!==difficulty) return false;
    return true;
  });
}
function poolForReorder(){
  return ALL.filter(e=>{
    if(!e.chunks) return false;
    if(filterLesson!=='all' && e.l!==filterLesson) return false;
    if(difficulty!=='all' && e.diff!==difficulty) return false;
    return true;
  });
}
function poolForCompletion(){
  return ALL.filter(e=>{
    if(e.reorderOnly) return false;
    if(e.s.indexOf('，')===-1) return false;
    if(filterLesson!=='all' && e.l!==filterLesson) return false;
    if(difficulty!=='all' && e.diff!==difficulty) return false;
    return true;
  });
}

function pickTarget(pool){
  let candidates = pool.filter(w=>!recentWords.includes(w.w));
  if(candidates.length===0) candidates = pool;
  const t = candidates[Math.floor(Math.random()*candidates.length)];
  recentWords.push(t.w);
  const cap = Math.min(10, Math.max(0,pool.length-1));
  if(recentWords.length>cap) recentWords.shift();
  return t;
}

function pyDistractors(target, count){
  const poolPy = [...new Set(ALL.filter(e=>e.py && e.py!==target.py).map(e=>e.py))];
  const scored = poolPy.map(p=>({p, d:levenshtein(target.py,p)})).sort((a,b)=>a.d-b.d);
  let picks;
  if(difficulty==='hard'){
    picks = scored.slice(0,count);
  } else if(difficulty==='easy'){
    const farHalf = scored.slice(Math.floor(scored.length*0.5));
    picks = shuffle(farHalf).slice(0,count);
  } else {
    const closeChunk = scored.slice(0, Math.max(count*3,8));
    picks = shuffle(closeChunk).slice(0,count);
  }
  return picks.map(x=>x.p);
}
function wordDistractors(target, count){
  const src = ALL.filter(e=>!e.reorderOnly && e.w!==target.w);
  return shuffle(src).slice(0,count).map(e=>e.w);
}

function buildSentenceParts(target){
  const idx = target.s.indexOf(target.w);
  if(idx===-1) return {before:target.s, mid:target.w, after:''};
  return {before:target.s.slice(0,idx), mid:target.w, after:target.s.slice(idx+target.w.length)};
}

   Question type generators
   ============================================================ */
function typeWeights(){
  if(difficulty==='easy') return {A:3,B:3,G:2,D:1,F:2,C:2};
  if(difficulty==='medium') return {A:2,B:2,G:2,D:2,H:1,F:2,C:2};
  if(difficulty==='hard') return {A:2,B:1,G:1,D:2,H:1,F:2,C:2};
  return {A:2,B:2,G:2,D:2,H:1,F:2,C:2};
}
function weightedPick(weights, allowed){
  const keys = Object.keys(weights).filter(k=>allowed.includes(k));
  const total = keys.reduce((s,k)=>s+weights[k],0);
  let r = Math.random()*total;
  for(const k of keys){ r -= weights[k]; if(r<=0) return k; }
  return keys[0];
}

function poolZibian(){
  return ZIBIAN.filter(z=>{
    if(filterLesson!=='all' && z.l!==filterLesson) return false;
    return true;
  });
}
function poolDapei(){
  return DAPEI.filter(d=>{
    if(filterLesson!=='all' && d.l!==filterLesson) return false;
    return true;
  });
}

function nextQuestion(){
  checked = false;
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';
  const actionBtn = document.getElementById('actionBtn');
  actionBtn.textContent = '检查';
  actionBtn.disabled = true;
  actionBtn.classList.remove('ok','no');

  const pReorder = poolForReorder();
  const pCompletion = poolForCompletion();
  const pPy = poolFor(true,false);
  const pWord = poolFor(false,false);
  const pZibian = poolZibian();
  const pDapei = poolDapei();

  const allowed = [];
  if(pWord.length) allowed.push('B');
  if(pPy.length){ allowed.push('A'); allowed.push('G'); }
  if(pReorder.length) allowed.push('D');
  if(pCompletion.length && difficulty!=='easy') allowed.push('H');
  if(pZibian.length) allowed.push('F');
  if(pDapei.length>=4) allowed.push('C');

  if(allowed.length===0){
    document.getElementById('sentence').innerHTML = '这个组合暂时没有题目，换个课文或难度试试吧～';
    document.getElementById('instruction').textContent = '';
    document.getElementById('qbody').innerHTML = '';
    return;
  }

  const type = weightedPick(typeWeights(), allowed);
  let target;
  if(type==='D') target = pickTarget(pReorder);
  else if(type==='H') target = pickTarget(pCompletion);
  else if(type==='A'||type==='G') target = pickTarget(pPy);
  else if(type==='F') target = pZibian[Math.floor(Math.random()*pZibian.length)];
  else if(type==='C') target = pDapei[Math.floor(Math.random()*pDapei.length)];
  else target = pickTarget(pWord);

  const lessonLabel = (type==='F'||type==='C') ? (LESSON_LABELS[target.l]||target.l) : (LESSON_LABELS[target.l]||target.l);
  document.getElementById('lessonChip').textContent = lessonLabel;

  current = {type, target};

  if(type==='A') renderTypeA(target);
  else if(type==='G') renderTypeG(target);
  else if(type==='B') renderTypeB(target);
  else if(type==='D') renderTypeD(target);
  else if(type==='H') renderTypeH(target);
  else if(type==='F') renderTypeF(target);
  else if(type==='C') renderTypeC(target);
}

function setInstruction(txt){ document.getElementById('instruction').textContent = txt; }
function setQType(txt){ document.getElementById('qType').textContent = txt; }

/* Type A: 拼音选择 - underline target word, pick correct pinyin */
function renderTypeA(target){
  setQType('拼音选择');
  const parts = buildSentenceParts(target);
  document.getElementById('sentence').innerHTML =
    escapeHtml(parts.before) + `<span class="target">${escapeHtml(parts.mid)}</span>` + escapeHtml(parts.after);
  setInstruction('选出划线词语的正确拼音：');
  const options = shuffle([target.py, ...pyDistractors(target,3)]);
  renderOptions(options, target.py, (val)=>val, true);
}

/* Type G: 看拼音选字 - show pinyin cue in place, choose correct hanzi */
function renderTypeG(target){
  setQType('看拼音选字');
  const parts = buildSentenceParts(target);
  document.getElementById('sentence').innerHTML =
    escapeHtml(parts.before) + `<span class="pinyincue">（${escapeHtml(target.py)}）</span>` + escapeHtml(parts.after);
  setInstruction('根据拼音提示，选出正确的词语：');
  const options = shuffle([target.w, ...wordDistractors(target,3)]);
  renderOptions(options, target.w, (val)=>val, false);
}

/* Type B: 字词填空 - blank word, choose from options */
function renderTypeB(target){
  const isIdiom = target.l==='idiom';
  setQType(isIdiom ? '成语填空' : '字词填空');
  const parts = buildSentenceParts(target);
  const blankLen = Math.max(2, target.w.length);
  document.getElementById('sentence').innerHTML =
    escapeHtml(parts.before) + `<span class="blank">${'＿'.repeat(blankLen)}</span>` + escapeHtml(parts.after);
  setInstruction('选出正确的词语，填入句子的空格中：');
  const options = shuffle([target.w, ...wordDistractors(target,3)]);
  renderOptions(options, target.w, (val)=>val, false);
}

/* Common option renderer for A/B/G */
function renderOptions(options, correctVal, getVal, isPinyin){
  const body = document.getElementById('qbody');
  body.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'options';
  options.forEach(optVal=>{
    const b = document.createElement('button');
    b.className = 'opt' + (isPinyin ? ' pinyin' : '');
    b.textContent = optVal;
    b.onclick = ()=>{
      if(checked) return;
      document.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
      b.classList.add('selected');
      current.selected = optVal;
      document.getElementById('actionBtn').disabled = false;
    };
    grid.appendChild(b);
  });
  body.appendChild(grid);
}

/* Type D: 组词成句 - tap tokens in order */
function renderTypeD(target){
  setQType('组词成句');
  document.getElementById('sentence').innerHTML = '<span style="color:#8B7F5E;font-size:.95rem;">把下面的词语按正确顺序排成一句话：</span>';
  setInstruction('');
  const body = document.getElementById('qbody');
  const answerArr = [];
  let bankChunks = shuffle(target.chunks);
  let attempts=0;
  while(JSON.stringify(bankChunks)===JSON.stringify(target.chunks) && attempts<5){ bankChunks = shuffle(target.chunks); attempts++; }

  function render(){
    body.innerHTML = '';
    const az = document.createElement('div');
    az.className = 'answerzone';
    answerArr.forEach((tokText, idx)=>{
      const t = document.createElement('div');
      t.className = 'tok placed';
      t.textContent = tokText;
      t.onclick = ()=>{
        if(checked) return;
        answerArr.splice(idx,1);
        render();
      };
      az.appendChild(t);
    });
    body.appendChild(az);

    const bank = document.createElement('div');
    bank.className = 'bank';
    // show each bank tile unless a matching-text instance has already been placed
    const used = {};
    answerArr.forEach(t=>{ used[t]=(used[t]||0)+1; });
    const shown = {};
    bankChunks.forEach(tokText=>{
      shown[tokText]=(shown[tokText]||0)+1;
      const alreadyUsed = used[tokText]||0;
      if(shown[tokText] <= alreadyUsed) return; // this instance is currently placed in the answer
      const t = document.createElement('div');
      t.className = 'tok';
      t.textContent = tokText;
      t.onclick = ()=>{
        if(checked) return;
        answerArr.push(tokText);
        render();
      };
      bank.appendChild(t);
    });
    body.appendChild(bank);

    document.getElementById('actionBtn').disabled = answerArr.length !== target.chunks.length;
  }
  render();
  current.getAnswer = ()=>answerArr;
}

/* Type H: 完成句子 - pick correct completion after first comma */
function renderTypeH(target){
  setQType('完成句子');
  const idx = target.s.indexOf('，');
  const stem = target.s.slice(0, idx+1);
  const correctCompletion = target.s.slice(idx+1);
  document.getElementById('sentence').innerHTML = escapeHtml(stem) + '<span class="blank">……</span>';
  setInstruction('选出最合适的句子，把它补充完整：');

  const others = ALL.filter(e=>e.s!==target.s && e.s.indexOf('，')>-1 && !e.reorderOnly);
  const distractorCompletions = shuffle(others).slice(0,3).map(e=>{
    const i2 = e.s.indexOf('，');
    return e.s.slice(i2+1);
  });
  const options = shuffle([correctCompletion, ...distractorCompletions]);

  const body = document.getElementById('qbody');
  body.innerHTML = '';
  options.forEach(optVal=>{
    const b = document.createElement('button');
    b.className='opt';
    b.style.gridColumn='1 / -1';
    b.style.textAlign='left';
    b.style.fontSize='1.02rem';
    b.textContent = optVal;
    b.onclick=()=>{
      if(checked) return;
      document.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
      b.classList.add('selected');
      current.selected = optVal;
      document.getElementById('actionBtn').disabled = false;
    };
    body.appendChild(b);
  });
  current.correctVal = correctCompletion;
}

/* Type F: 字辨 - pick the correct look-alike character */
function renderTypeF(target){
  setQType('字辨');
  const parts = target.s.split('___');
  document.getElementById('sentence').innerHTML =
    escapeHtml(parts[0]) + `<span class="blank">＿</span>` + (parts[1] ? escapeHtml(parts[1]):'');
  setInstruction(`根据拼音提示 <span class="pinyin" style="color:var(--ink);font-weight:700;">${escapeHtml(target.py)}</span>，选出正确的汉字：`);
  document.getElementById('instruction').innerHTML = document.getElementById('instruction').textContent;
  // re-render with innerHTML since we used a span
  document.getElementById('instruction').innerHTML =
    `根据拼音提示 <span class="pinyin" style="color:#1B2340;font-weight:700;">${escapeHtml(target.py)}</span>，选出正确的汉字：`;
  const options = shuffle([target.correct, ...target.wrong]);
  const body = document.getElementById('qbody');
  body.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'options';
  options.forEach(optVal=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = optVal;
    b.style.fontSize = '1.5rem';
    b.onclick = ()=>{
      if(checked) return;
      document.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
      b.classList.add('selected');
      current.selected = optVal;
      document.getElementById('actionBtn').disabled = false;
    };
    grid.appendChild(b);
  });
  body.appendChild(grid);
}

/* Type C: 词语搭配 - pick the matching collocate */
function renderTypeC(target){
  setQType('词语搭配');
  const showLeft = Math.random() < 0.5;
  const shown = showLeft ? target.left : target.right;
  const answer = showLeft ? target.right : target.left;
  document.getElementById('sentence').innerHTML =
    showLeft ? `${escapeHtml(shown)} + <span class="blank">？</span>` :
              `<span class="blank">？</span> + ${escapeHtml(shown)}`;
  setInstruction('选出最合适的词语搭配：');
  // distractors: other DAPEI entries' matching side
  const others = DAPEI.filter(d=>d!==target);
  const distPool = showLeft ? others.map(d=>d.right) : others.map(d=>d.left);
  const uniqueDist = [...new Set(distPool.filter(d=>d!==answer))];
  const distractors = shuffle(uniqueDist).slice(0,3);
  const options = shuffle([answer, ...distractors]);
  const body = document.getElementById('qbody');
  body.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'options';
  options.forEach(optVal=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = optVal;
    b.onclick = ()=>{
      if(checked) return;
      document.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
      b.classList.add('selected');
      current.selected = optVal;
      current.correctVal = answer;
      document.getElementById('actionBtn').disabled = false;
    };
    grid.appendChild(b);
  });
  body.appendChild(grid);
  current.correctVal = answer;
}

/* ============================================================
   Grading / Duolingo-style check flow
   ============================================================ */
function doCheck(){
  if(checked){ nextQuestion(); return; }
  checked = true;
  total++;
  let isCorrect = false;
  const fb = document.getElementById('feedback');
  const actionBtn = document.getElementById('actionBtn');
  const target = current.target;

  if(current.type==='A' || current.type==='G' || current.type==='B'){
    const correctVal = current.type==='B' ? target.w : (current.type==='G' ? target.w : target.py);
    isCorrect = current.selected === correctVal;
    document.querySelectorAll('.opt').forEach(o=>{
      o.disabled = true;
      if(o.textContent === correctVal) o.classList.add('correct');
      else if(o.classList.contains('selected') && !isCorrect) o.classList.add('wrong');
      else o.classList.add('dim');
    });
  } else if(current.type==='H' || current.type==='C'){
    isCorrect = current.selected === current.correctVal;
    document.querySelectorAll('.opt').forEach(o=>{
      o.disabled = true;
      if(o.textContent === current.correctVal) o.classList.add('correct');
      else if(o.classList.contains('selected') && !isCorrect) o.classList.add('wrong');
      else o.classList.add('dim');
    });
  } else if(current.type==='F'){
    isCorrect = current.selected === target.correct;
    document.querySelectorAll('.opt').forEach(o=>{
      o.disabled = true;
      if(o.textContent === target.correct) o.classList.add('correct');
      else if(o.classList.contains('selected') && !isCorrect) o.classList.add('wrong');
      else o.classList.add('dim');
    });
  } else if(current.type==='D'){
    const ans = current.getAnswer();
    isCorrect = JSON.stringify(ans) === JSON.stringify(target.chunks);
    document.querySelectorAll('.tok.placed').forEach(t=>{
      t.classList.add(isCorrect ? 'tokcorrect':'tokwrong');
    });
    document.querySelectorAll('.tok:not(.placed)').forEach(t=>t.style.opacity='.4');
  }

  /* build a pseudo-target for recording stats (F and C targets lack .w/.m) */
  const recordTarget = (current.type==='F')
    ? {w:target.correct, m:'字辨: '+target.s.replace('___',target.correct), py:target.py, l:target.l, s:target.s}
    : (current.type==='C')
    ? {w:target.left+'+'+target.right, m:'词语搭配', py:'', l:target.l, s:''}
    : target;
  recordAnswer(recordTarget, isCorrect);

  if(isCorrect){
    score++; streak++; litStars++;
    playCorrectSound();
    fb.classList.add('ok'); fb.classList.remove('no');
    let extra = '';
    if(current.type==='A') extra = `「${target.w}」读作 <b class="pinyin">${target.py}</b>`;
    else if(current.type==='D') extra = '句子顺序正确！';
    else if(current.type==='F') extra = `正确答案是「${target.correct}」`;
    else if(current.type==='C') extra = `${target.left} + ${target.right}`;
    else extra = `「${target.w}」`;
    const meaning = target.m || '';
    fb.innerHTML = `✅ 答对了！${extra}` + (meaning ? `<span class="meaning">意思：${meaning}</span>` : '');
    actionBtn.classList.add('ok');
  } else {
    streak = 0;
    playWrongSound();
    fb.classList.add('no'); fb.classList.remove('ok');
    let correctDisplay = target.w || '';
    if(current.type==='A') correctDisplay = target.py;
    else if(current.type==='H'||current.type==='C') correctDisplay = current.correctVal;
    else if(current.type==='D') correctDisplay = target.chunks.join('');
    else if(current.type==='F') correctDisplay = target.correct;
    const meaning = target.m || '';
    fb.innerHTML = `❌ 再想想～ 正确答案是「${correctDisplay}」` + (meaning ? `<span class="meaning">${meaning}</span>` : '');
    actionBtn.classList.add('no');
  }
  fb.classList.add('show');
  actionBtn.textContent = '继续 →';
  actionBtn.disabled = false;

  document.getElementById('scoreNum').textContent = score;
  document.getElementById('totalNum').textContent = total;
  document.getElementById('streakNum').textContent = streak;
  renderConstellation();
}

document.getElementById('actionBtn').onclick = doCheck;
document.getElementById('skipBtn').onclick = nextQuestion;

/* ============================================================
   Init
   ============================================================ */
renderLessonSelect();
renderDiffRow();
renderConstellation();
loadStats();
nextQuestion();
